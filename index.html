<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salle des fêtes – Visite virtuelle 3D · ANTEMIC</title>
<link rel="icon" type="image/webp" href="assets/antemic-croix.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
/* Charte ANTEMIC (antemic.fr) : fond #0F0414, rouge #E00E45 / #D72F4C, gris clair #EDF2F7,
   Archivo (800 capitales pour les titres, 300 pour le texte), angles 3 px, repère « >> ». */
:root{
  --night:#0F0414; --red:#E00E45; --red-2:#D72F4C; --mist:#EDF2F7; --white:#fff;
  --panel:rgba(15,4,20,.86); --line:rgba(255,255,255,.10); --muted:rgba(237,242,247,.72);
  --r:3px; --shadow:0 8px 28px rgba(15,4,20,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Archivo,system-ui,sans-serif;font-weight:300;color:var(--white);background:var(--night)}
button{font-family:inherit}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tag{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.tag::before{content:">> "}

/* en-tête */
header{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;pointer-events:none;z-index:3}
header>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:14px;padding:9px 16px 9px 14px;text-decoration:none;color:inherit}
.brand img{height:20px;width:auto;display:block}
.brand .sep{width:1px;align-self:stretch;background:var(--line)}
.brand h1{margin:0;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.brand h1 .tag{display:block;font-size:10.5px;margin-top:2px}
.seg{display:flex;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:0 14px;min-height:34px;border-radius:var(--r);font-weight:800;font-size:12px;
  text-transform:uppercase;letter-spacing:.05em;cursor:pointer;color:var(--mist);transition:background .15s,color .15s}
.seg button:hover{color:var(--white);background:rgba(255,255,255,.06)}
.seg button.on{background:var(--red);color:var(--white)}

/* aide */
#help{position:fixed;top:76px;left:12px;font-size:12.5px;padding:9px 13px;max-width:350px;line-height:1.5;color:var(--muted);z-index:3}
#help b{color:var(--white);font-weight:800;text-transform:uppercase;letter-spacing:.03em}

/* pièces */
#rooms{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 270px);z-index:3}
#rooms button{border:1px solid var(--line);background:var(--panel);color:var(--mist);padding:8px 12px;border-radius:var(--r);
  font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .15s,background .15s}
#rooms button:hover{border-color:var(--red);color:var(--white)}
#rooms button:active{background:var(--red)}

/* radar */
#map{position:fixed;right:16px;bottom:14px;width:224px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
#mapc{width:224px;height:224px;display:block;border-radius:50%;cursor:crosshair;filter:drop-shadow(0 10px 26px rgba(15,4,20,.55))}
#map .zone{display:flex;align-items:center;gap:8px;padding:6px 12px;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
#map .zone .tag{font-size:10px}
#map .credit{color:var(--muted);font-size:9.5px;text-decoration:none;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 1px 4px rgba(15,4,20,.8)}
#map .credit:hover{color:var(--red)}

/* étiquettes 3D */
#hotspots{position:fixed;inset:0;pointer-events:none;z-index:2}
.hp{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;background:var(--panel);
  color:var(--white);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:5px 10px 5px 5px;
  border:1px solid var(--line);border-radius:var(--r);white-space:nowrap;pointer-events:auto;cursor:pointer;transition:border-color .15s}
.hp::before{content:"";width:18px;height:18px;border-radius:2px;background:url(assets/antemic-croix.webp) center/14px no-repeat var(--red)}
.hp:hover{border-color:var(--red)}

/* fiche */
#card{position:fixed;top:76px;right:12px;width:310px;padding:16px 18px 16px;border-top:3px solid var(--red);z-index:4}
#card h2{margin:4px 0 8px;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
#card p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
#card .close{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:var(--r);background:none;font-size:20px;cursor:pointer;color:var(--muted)}
#card .close:hover{background:var(--red);color:var(--white)}

/* viseur balade */
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:1px;background:var(--red);box-shadow:0 0 0 2px rgba(255,255,255,.7);z-index:2;pointer-events:none}

/* chargement */
#load{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:22px;background:var(--night);z-index:9}
#load img{width:220px;height:auto}
#load .bar{width:220px;height:3px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
#load .bar::after{content:"";display:block;width:40%;height:100%;background:var(--red);animation:slide 1.1s ease-in-out infinite}
#load .msg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

@media (max-width:720px){
  header{flex-wrap:nowrap}
  #map{width:132px;right:10px;bottom:10px;gap:6px} #mapc{width:132px;height:132px} #map .credit{display:none}
  #map .zone{font-size:9.5px;padding:4px 8px} #map .zone .tag{display:none}
  #rooms{max-width:calc(100% - 158px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  #rooms::-webkit-scrollbar{display:none}
  #rooms button{padding:8px 10px;font-size:10.5px;flex:0 0 auto}
  #help{display:none}
  .brand h1,.brand .sep{display:none} .brand{padding:9px 11px} .brand img{height:16px}
  .seg button{padding:0 10px;font-size:11px;min-height:32px}
  #card{left:12px;right:12px;width:auto;top:66px}
}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="load">
  <img src="assets/antemic-logo.webp" alt="ANTEMIC">
  <div class="bar"></div>
  <div class="msg">Chargement de la salle</div>
</div>
<header>
  <a class="brand glass" href="https://www.antemic.fr" target="_blank" rel="noopener" title="ANTEMIC – studio 3D">
    <img src="assets/antemic-logo.webp" alt="ANTEMIC">
    <span class="sep"></span>
    <h1>Salle des fêtes<span class="tag">Visite virtuelle 3D</span></h1>
  </a>
  <div class="seg glass"><button id="mOrbit" class="on">Vue générale</button><button id="mWalk">Balade</button></div>
</header>
<div id="help" class="glass"></div>
<div id="hotspots"></div>
<aside id="card" class="glass" hidden><button class="close" aria-label="Fermer">×</button><span class="tag">Pièce</span><h2></h2><p></p></aside>
<div id="cross" hidden></div>
<div id="rooms"></div>
<div id="map">
  <canvas id="mapc" width="448" height="448" title="Cliquez pour vous déplacer"></canvas>
  <div class="zone glass"><span class="tag">Zone</span><span id="zone"></span></div>
  <a class="credit" href="https://www.antemic.fr" target="_blank" rel="noopener">Réalisé par Antemic</a>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
